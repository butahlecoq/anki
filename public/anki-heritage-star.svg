<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    An original four-pointed star drawn for Kiroku. Anki's own star is
    Ankitects' trademark, so this is deliberately not a copy of it: the geometry
    is a plain four-point sparkle with concave sides. It is applied as a CSS mask
    (see .heritage-star in src/styles.css), so the fill is only a silhouette and
    the theme's accent tokens decide the colour.
  -->
